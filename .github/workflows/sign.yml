name: Sign shortcuts
on: [push, workflow_dispatch]

jobs:
  sign:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sign all .shortcut files
        run: |
          mkdir -p signed
          shopt -s nullglob
          for f in *.shortcut; do
            shortcuts sign --mode anyone --input "$f" --output "signed/${f%.shortcut} signed.shortcut"
            echo "signed: $f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: signed-shortcuts
          path: signed/
